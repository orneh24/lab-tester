# Log rotation for mesh-probe on nodes.
#
# test-cycle.sh runs every 60 seconds and appends full traceroute output for
# every target. At 4-5 targets that is roughly 5-10 MB per day, which will
# fill a 2 GB template disk within a few weeks if left unrotated.
#
# Installed to /etc/logrotate.d/mesh-probe by build-template.sh.

/var/log/mesh-probe/*.log {
    daily
    rotate 3
    maxsize 10M
    missingok
    notifempty
    copytruncate
    compress
    delaycompress
}
