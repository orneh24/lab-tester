# mesh-probe SMB probe server — minimum viable, read-only, anonymous.
#
# Every node runs smbd exporting one small read-only share so every peer
# can pull a fixed probe file with smbclient. SMB is chatty and
# session-oriented — the protocol most likely to be tripped up by an
# inspection policy, an MSS/MTU problem mid-transfer, or a NAT path that only
# tolerates short-lived flows, none of which the existing HTTP/SSH/iperf3
# tests would catch.
#
# Installed to /etc/samba/smb.conf by build-template.sh / setup.sh. Only
# started when ENABLE_SMB=true (see test-cycle.sh, setup.sh, config.sample).

[global]
    workgroup = MESHPROBE
    server string = mesh-probe probe server

    # Anonymous, no-account access: map to guest = Bad User makes any login
    # attempt (including smbclient -N's null session) fall through to the
    # guest account instead of failing, so no per-VM credentials are needed.
    security = user
    map to guest = Bad User
    guest account = nobody

    # RAM guards for a 128 MB VM. The mesh means every peer can connect at
    # roughly the same moment each cycle; cap how many children that spawns
    # and reap idle ones quickly rather than let them pile up.
    max smbd processes = 10
    deadtime = 2

    # Nothing here prints or joins a domain — disable spoolss/printing/
    # winbind so smbd doesn't spawn helper processes or listen on sockets
    # this test has no use for.
    load printers = no
    printing = bsd
    printcap name = /dev/null
    disable spoolss = yes
    winbind enabled = no

    # Must match pidfile= in services/smbd.initd (installed as mesh-probe-smbd).
    pid directory = /run

    # Not bound to a specific interface: build-template.sh runs before a
    # clone's inside NIC is known (DHCP-assigned, varies per VM), so this is
    # left unbound. If a specific deployment knows its interface name ahead
    # of time, add here:
    #   interfaces = eth0
    #   bind interfaces only = yes

    log level = 1
    log file = /var/log/mesh-probe/smbd.log
    max log size = 1000

[labshare]
    path = /srv/mesh-probe-smb
    guest ok = yes
    read only = yes
    browseable = yes
