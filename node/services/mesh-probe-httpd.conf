# Busybox httpd configuration for mesh-probe node
# Serves the identity page on port 80
# Place this at /etc/httpd.conf or pass via httpd -c <path>
#
# Home directory is NOT set here — busybox httpd has no config-file directive
# for it ("H:" looks plausible but isn't real syntax; busybox logs it as a
# config error and ignores it). It comes from the -h flag in the initd
# (node/services/httpd.initd), which is the only thing that ever set it
# correctly.
#
# MIME types use a bare leading dot. The "*.ext:target" form (asterisk
# prefix) is busybox httpd's CGI-interpreter binding syntax — "execute the
# program at `target` for every matching request" — not a MIME mapping. With
# an asterisk here busybox tried to execve("text/html", ...) as an
# interpreter for every .html request, which obviously isn't a program, and
# every request 404'd ("can't execute 'text/html': No such file or
# directory") regardless of what actually existed in the docroot. Confirmed
# against a live Alpine 3.24.1 / busybox 1.37.0-r31 node: verbose httpd
# logging showed the exact "can't execute" failure for both '/' and an
# explicit '/index.html' request against a file that demonstrably existed
# with correct permissions.
.html:text/html
.txt:text/plain
.json:application/json
