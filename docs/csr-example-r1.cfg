! === Per-router example — R1. Apply after csr-baseline.cfg. ===
! Every value below is router-specific; substitute for R2, R3, etc.
! Placeholders: <R1_OUTSIDE_IP> <OUTSIDE_MASK> <OUTSIDE_IF>
!               <R1_MGMT_IP> <MGMT_MASK> <MGMT_IF> <INSIDE_IF>
!               <R1_INSIDE_SUBNET> <R1_INSIDE_MASK> <R1_INSIDE_WILDCARD>
!               <R1_INSIDE_GW> <R1_LOOPBACK_IP> <DNS_SERVER_IP> <R1_AS>
!               <R2_OUTSIDE_IP> <R2_AS> <R3_OUTSIDE_IP> <R3_AS> -- one
!               neighbor pair per other router on Outside-shared (eBGP,
!               each router its own AS)
!               <INTERNET_GW_IP> -- internet gateway reachable on
!               Outside-shared, for NAT overload's default route
! DEPLOYMENT.md's own worked example uses 10.1.1.0/24 inside for R1;
! BUILD_GUIDE.md's static-target example (R1-Lo0) uses 10.255.255.1/32 for
! its loopback — reuse those or replace with real values.

hostname R1

interface Loopback0
 ip address <R1_LOOPBACK_IP> 255.255.255.255

interface <MGMT_IF>
 description Management VLAN
 vrf forwarding MGMT
 ip address <R1_MGMT_IP> <MGMT_MASK>
 no shutdown

interface <OUTSIDE_IF>
 description Outside-shared -- peer routers + hub data-plane segment
 ip address <R1_OUTSIDE_IP> <OUTSIDE_MASK>
 ip nat outside
 no shutdown

interface <INSIDE_IF>
 description Inside-R1 -- test VM subnet
 ip address <R1_INSIDE_GW> <R1_INSIDE_MASK>
 ip nat inside
 no shutdown

ip dhcp excluded-address <R1_INSIDE_GW>
ip dhcp pool INSIDE-R1
 network <R1_INSIDE_SUBNET> <R1_INSIDE_MASK>
 default-router <R1_INSIDE_GW>
 dns-server <DNS_SERVER_IP>

! No outside-subnet network statement needed -- it's directly connected
! on every peer, so next-hop stays reachable with no recursive lookup.
! eBGP, directly connected (single hop) -- no ebgp-multihop needed.
router bgp <R1_AS>
 bgp log-neighbor-changes
 bgp router-id <R1_LOOPBACK_IP>
 network <R1_LOOPBACK_IP> mask 255.255.255.255
 network <R1_INSIDE_SUBNET> mask <R1_INSIDE_MASK>
 neighbor <R2_OUTSIDE_IP> remote-as <R2_AS>
 neighbor <R2_OUTSIDE_IP> description eBGP to R2
 neighbor <R3_OUTSIDE_IP> remote-as <R3_AS>
 neighbor <R3_OUTSIDE_IP> description eBGP to R3

! === NAT for internet access via Outside-shared ===
! PAT overload: R1's inside subnet hides behind <OUTSIDE_IF>'s address
! leaving toward <INTERNET_GW_IP>. Static default, not redistributed into
! BGP -- every router reaches the same gateway directly on Outside-shared,
! so there's nothing to leak to peers.
ip access-list standard NAT-R1-INSIDE
 permit <R1_INSIDE_SUBNET> <R1_INSIDE_WILDCARD>

ip nat inside source list NAT-R1-INSIDE interface <OUTSIDE_IF> overload

ip route 0.0.0.0 0.0.0.0 <INTERNET_GW_IP>
