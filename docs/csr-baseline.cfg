! === CSR1000v baseline — apply identically to every router before per-router config ===
! Placeholders: <ENABLE_SECRET> <LOCAL_USER> <LOCAL_PASSWORD> <DOMAIN_NAME>
!               <HUB_MGMT_IP> <UPSTREAM_NTP_IP> <SNMP_RO_COMMUNITY>

service timestamps log datetime msec localtime show-timezone
service timestamps debug datetime msec localtime show-timezone
no ip domain-lookup

! LLDP, globally then confirmed per-interface below. Both the hub and every
! test VM run lldpd now, so `show lldp neighbors` on the router is a direct
! check for "is this VM/hub actually cabled to the port we think it is" --
! the same wrong-port-group failure the VM side uses lldpcli to catch, from
! the other end.
lldp run

! Management VRF — do this before any IP goes on the mgmt interface.
! `vrf forwarding` wipes an interface's IP config, so applying it later is disruptive.
vrf definition MGMT
 address-family ipv4
 exit-address-family

enable secret <ENABLE_SECRET>
username <LOCAL_USER> privilege 15 secret <LOCAL_PASSWORD>

ip domain-name <DOMAIN_NAME>
crypto key generate rsa modulus 2048
ip ssh version 2

line vty 0 4
 login local
 transport input ssh

! Syslog / NTP — both MUST carry vrf MGMT or they silently no-op
! (global-table lookup finds nothing, router reports no error).
logging trap informational
logging host <HUB_MGMT_IP> vrf MGMT
ntp server vrf MGMT <UPSTREAM_NTP_IP>

! SNMP polling (read-only) from the hub over MGMT. No `vrf` keyword needed
! on the community/ACL -- unlike logging/ntp, which are the router
! INITIATING traffic into a VRF, this is the hub polling IN to the
! router's mgmt interface, so the request already arrives in VRF MGMT's
! routing context and the agent answers on the same path. Restricting the
! ACL to the hub's mgmt IP is what actually confines this to that VRF.
! ifindex persist keeps interface counters aligned to the same index
! across reloads, since polled trend data (errors, utilization) is the
! whole reason to add SNMP over what syslog already provides.
snmp-server ifindex persist
ip access-list standard SNMP-RO
 permit host <HUB_MGMT_IP>
snmp-server community <SNMP_RO_COMMUNITY> RO SNMP-RO

! Routing is eBGP, one AS per router -- the `router bgp <AS>` line itself
! isn't common text (the AS number differs per router), so the whole BGP
! block lives in the per-router config. No underlying IGP: peers are the
! directly-connected outside-interface IPs, so peering breaks exactly
! when that segment breaks -- that's the path this lab exists to test.
