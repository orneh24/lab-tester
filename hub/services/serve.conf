# Busybox httpd configuration for lab-tester-serve (router config download
# server). Home directory is set via -h in serve.initd's command_args, not
# an H: line here, so it always matches whatever SERVE_DIR is configured to
# in /etc/conf.d/lab-tester-serve rather than a value baked into this file.
#
# No index.html is ever placed in the served directory, so busybox httpd's
# automatic directory listing renders for every path -- that listing is what
# makes the download URL browsable.

# MIME types -- Cisco IOS-XE config files have no single fixed extension in
# this lab (docs/csr-*.cfg uses .cfg); treat all of these as plain text.
*.cfg:text/plain
*.conf:text/plain
*.txt:text/plain
